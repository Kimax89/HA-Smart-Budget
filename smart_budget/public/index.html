<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#163c35" />
    <title>Smart Budget</title>
    <script src="./theme.js"></script>
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./"
        ><img class="brand-logo" src="./logo.svg" alt="" width="45" height="50" /> Smart Budget</a
      >
      <div class="header-controls">
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          role="switch"
          aria-checked="false"
          aria-label="Dark mode"
          title="Dark mode"
        >
          <span class="theme-switch-knob" aria-hidden="true"></span>
        </button>
        <details id="navigation-menu" class="header-menu">
          <summary id="navigation-toggle" aria-label="Navigation">
            <span class="burger-icon" aria-hidden="true"
              ><span></span><span></span><span></span></span
            ><span class="sr-only">Menu</span>
          </summary>
          <nav class="header-nav" aria-label="Budgetvisninger">
            <button data-tab="overview" class="active">Overblik</button
            ><button data-tab="items">Budgetposter</button
            ><button data-tab="people">Personer</button><button data-tab="accounts">Konti</button
            ><button data-tab="categories">Kategorier</button
            ><button data-tab="ledger">Regnskab</button>
          </nav>
        </details>
      </div>
    </header>
    <main>
      <section id="summary" class="summary" aria-label="Månedens nøgletal" hidden></section>
      <section class="heading">
        <div id="status" class="status-row"></div>
        <div class="month-tools">
          <div id="month-actions" class="actions"></div>
          <div class="month-control">
            <button id="prev" class="icon-button" aria-label="Forrige måned">‹</button
            ><label
              ><span class="sr-only">Vælg måned</span
              ><input id="month" type="month" min="2000-01" max="2199-12" /></label
            ><button id="next" class="icon-button" aria-label="Næste måned">›</button>
          </div>
        </div>
      </section>
      <div id="messages" aria-live="polite"></div>
      <section id="content" aria-live="polite"><p>Henter budget…</p></section>
      <footer>
        <span>Smart Budget · 0.2.8</span
        ><span>Beløb i danske kroner · Personlige udgifter trækkes efter fordeling</span>
      </footer>
    </main>
    <dialog id="editor">
      <form id="edit-form">
        <div class="dialog-heading">
          <h2 id="dialog-title"></h2>
          <button type="button" id="cancel-x" class="icon-button" aria-label="Luk">×</button>
        </div>
        <div id="fields"></div>
        <p id="form-error" class="error" role="alert"></p>
        <div class="dialog-actions">
          <button id="cancel" type="button" class="secondary">Annuller</button
          ><button type="submit" class="primary">Anvend</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
