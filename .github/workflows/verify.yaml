name: Verify budget and containers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: smart_budget
      - run: npm run format:check
        working-directory: smart_budget
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./smart_budget
      - run: npm test
        working-directory: smart_budget
      - run: node --check smart_budget/public/app.js
  containers:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        dockerfile: [Dockerfile, Dockerfile.standalone]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./smart_budget
          file: ./smart_budget/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Build native image for runtime checks
        run: docker build -f smart_budget/${{ matrix.dockerfile }} -t budget-check smart_budget
      - name: Check SQLite and budget calculations inside container
        run: docker run --rm budget-check node --input-type=module -e "import {BudgetStore} from './src/store.js'; const s=new BudgetStore(':memory:'); if(s.get('2030-01').state.people.length!==0) process.exit(1); s.close();"
      - name: Check HTTP, Ingress, unprivileged service and data upgrade
        run: bash scripts/smoke-container.sh '${{ matrix.dockerfile }}'
      - name: Show container logs on failure
        if: failure()
        run: docker logs budget-ci || true
